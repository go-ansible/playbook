name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # go-ansible/template's tag lagged proxy.golang.org's per-version
  # indexing when it was first published (see go-ansible/modules'
  # CI for the details) — fetching straight from git sidesteps any
  # repeat of that; go.sum still pins every module's content hash.
  GOPROXY: direct
  GOSUMDB: "off"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      # ansible-core is the REFERENCE this port is measured against, and the
      # only thing that can say whether a drop-in replacement is drop-in. The
      # interop tests here have never run: the helper skipped, and no lane
      # installed it.
      #
      # 2.21.4 is the version this repository's measurements were taken
      # against (comments in the source name it), so the judge is pinned to it
      # rather than to whatever is newest. A conformance oracle that moves on
      # its own is not an oracle.
      - name: ansible-core, the reference this port must match
        run: pipx install ansible-core==2.21.4

      - name: Test
        env:
          # A skip here would look exactly like a pass.
          ANSIBLE_REQUIRE: "1"
        run: go test ./...

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go env GOARCH && CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
